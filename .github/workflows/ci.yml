name: REA Quality Gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/refresh_manifest.py --check
      - run: python scripts/gate.py
      - run: python -m pip_audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-gate-evidence
          path: docs/evidence/gate-report.json
